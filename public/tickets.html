<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tickets | HelpDesk</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial;
        margin: 0;
        background: #f4f6f8;
        color: #1f2937;
      }
      .wrap {
        max-width: 1250px;
        margin: 35px auto;
        padding: 0 20px;
      }
      .hero {
        background: #111827;
        color: #fff;
        padding: 25px;
        border-radius: 16px;
        margin-bottom: 20px;
      }
      .hero h1 {
        margin: 0 0 8px;
      }
      .hero a {
        color: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .card {
        background: #fff;
        padding: 24px;
        border-radius: 14px;
        box-shadow: 0 2px 10px #0001;
      }
      label {
        display: block;
        font-weight: bold;
        margin: 12px 0 6px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 11px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #2563eb;
        cursor: pointer;
        margin-top: 14px;
      }
      .warn {
        background: #d97706;
      }
      .danger {
        background: #dc2626;
      }
      .success {
        background: #16a34a;
      }
      .auto {
        background: #7c3aed;
      }
      .msg {
        margin-top: 12px;
        padding: 10px;
        border-radius: 8px;
      }
      .ok {
        background: #dcfce7;
        color: #166534;
      }
      .err {
        background: #fee2e2;
        color: #991b1b;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 11px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }
      .pill {
        padding: 5px 9px;
        border-radius: 999px;
        background: #e0e7ff;
        color: #3730a3;
        font-size: 12px;
        font-weight: bold;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <h1>🎫 Registro y gestión de tickets</h1>
        <a href="/">← Volver al dashboard</a>
      </div>
      <div class="grid">
        <div class="card">
          <h2>POST · Crear ticket</h2>
          <form id="create">
            <label>Título</label
            ><input
              id="title"
              required
              placeholder="Ej: Error en base de datos"
            /><label>Descripción</label
            ><textarea
              id="description"
              placeholder="Describe el problema"
            ></textarea
            ><label>Prioridad</label
            ><select id="priority">
              <option value="low">Baja</option>
              <option value="medium" selected>Media</option>
              <option value="high">Alta</option>
              <option value="critical">Crítica</option></select
            ><label>Usuario solicitante</label
            ><input
              id="requester_id"
              type="number"
              required
              placeholder="ID del usuario"
            /><label>Skill requerida</label
            ><input
              id="required_skill_id"
              type="number"
              required
              placeholder="ID de la skill"
            /><button class="success">Crear ticket</button>
          </form>
          <div id="cm"></div>
        </div>
        <div class="card">
          <h2>PUT · Actualizar ticket</h2>
          <form id="update">
            <label>ID del ticket</label
            ><input id="tid" type="number" required /><label>Título</label
            ><input id="utitle" required /><label>Descripción</label
            ><textarea id="udescription"></textarea><label>Prioridad</label
            ><select id="upriority">
              <option value="low">Baja</option>
              <option value="medium">Media</option>
              <option value="high">Alta</option>
              <option value="critical">Crítica</option></select
            ><label>Estado</label
            ><select id="status">
              <option value="open">Abierto</option>
              <option value="in_progress">En progreso</option>
              <option value="closed">Cerrado</option></select
            ><label>Usuario solicitante</label
            ><input id="urequester" type="number" required /><label
              >Skill requerida</label
            ><input id="uskill" type="number" required /><button class="warn">
              Actualizar ticket
            </button>
          </form>
          <div id="um"></div>
        </div>
      </div>
      <div class="card" style="margin-top: 18px">
        <h2>GET / DELETE · Tickets</h2>
        <button onclick="load()">🔄 Actualizar lista</button>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Prioridad</th>
              <th>Estado</th>
              <th>Agente</th>
              <th>Vencimiento</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <script>
      if (!localStorage.getItem("helpdeskUser")) location.href = "/login.html";
      const api = "/api/tickets";
      const esc = (s) =>
        String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      async function load() {
        const r = await fetch(api);
        const j = await r.json();
        rows.innerHTML =
          j.data
            .map(
              (x) =>
                `<tr><td>${x.id}</td><td>${esc(x.title)}</td><td><span class="pill">${x.priority}</span></td><td>${x.status}</td><td>${esc(x.agent_name || "Sin asignar")}</td><td>${x.due_at ? new Date(x.due_at).toLocaleString("es-CO") : "-"}</td><td><button class="warn" onclick='fill(${JSON.stringify(x)})'>Editar</button> <button class="auto" onclick="assign(${x.id})">Asignar</button> <button class="danger" onclick="del(${x.id})">Eliminar</button></td></tr>`,
            )
            .join("") || '<tr><td colspan="7">Sin tickets</td></tr>';
      }
      create.onsubmit = async (e) => {
        e.preventDefault();
        const r = await fetch(api, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: title.value,
            description: description.value,
            priority: priority.value,
            requester_id: Number(requester_id.value),
            required_skill_id: Number(required_skill_id.value),
          }),
        });
        const j = await r.json();
        cm.className = j.success ? "msg ok" : "msg err";
        cm.textContent = j.success ? "Ticket creado correctamente" : j.message;
        if (j.success) {
          create.reset();
          load();
        }
      };
      update.onsubmit = async (e) => {
        e.preventDefault();
        const r = await fetch(`${api}/${tid.value}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: utitle.value,
            description: udescription.value,
            priority: upriority.value,
            status: status.value,
            requester_id: Number(urequester.value),
            required_skill_id: Number(uskill.value),
          }),
        });
        const j = await r.json();
        um.className = j.success ? "msg ok" : "msg err";
        um.textContent = j.success ? "Ticket actualizado" : j.message;
        if (j.success) load();
      };
      function fill(x) {
        tid.value = x.id;
        utitle.value = x.title;
        udescription.value = x.description || "";
        upriority.value = x.priority;
        status.value = x.status;
        urequester.value = x.requester_id;
        uskill.value = x.required_skill_id;
        scrollTo({ top: 0, behavior: "smooth" });
      }
      async function del(id) {
        if (!confirm("¿Eliminar ticket #" + id + "?")) return;
        const r = await fetch(`${api}/${id}`, { method: "DELETE" });
        const j = await r.json();
        alert(j.message || "Operación realizada");
        load();
      }
      async function assign(id) {
        const r = await fetch(`${api}/${id}/auto-assign`, { method: "POST" });
        const j = await r.json();
        if (!r.ok) return alert(j.message);
        alert(
          `Ticket asignado. Puntaje: ${j.data.score}\\nVencimiento SLA: ${new Date(j.data.due_at).toLocaleString("es-CO")}`,
        );
        load();
      }
      load();
    </script>
  </body>
</html>
