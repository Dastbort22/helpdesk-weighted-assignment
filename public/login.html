<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión | HelpDesk</title>
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <h1>🎫 HelpDesk</h1>
        <p>Sistema de Mesa de Ayuda</p>
      </div>
      <h2>Iniciar sesión</h2>
      <form id="loginForm">
        <label>Email</label
        ><input
          id="email"
          type="email"
          required
          placeholder="correo@ejemplo.com"
          required
        /><label>Contraseña</label
        ><input
          id="password"
          type="password"
          required
          placeholder="••••••••"
          required
        /><button type="submit">Ingresar al sistema</button>
      </form>
      <div id="msg" class="msg"></div>
      <div class="hint">
        Después de iniciar sesión podrás gestionar usuarios y tickets mediante
        formularios, incluyendo crear, consultar, actualizar y eliminar
        registros.
      </div>
      <a class="link" href="/api-docs">Ver documentación Swagger</a>
    </main>
    <script>
      const loginForm = document.getElementById("loginForm");

      const emailInput = document.getElementById("email");

      const passwordInput = document.getElementById("password");

      const msg = document.getElementById("msg");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        const password = passwordInput.value;

        console.log("EMAIL:", email);

        console.log("PASSWORD:", password);

        if (email === "" || password === "") {
          msg.textContent = "Email y contraseña son requeridos";

          msg.className = "msg error";

          msg.style.display = "block";

          return;
        }

        try {
          msg.textContent = "Iniciando sesión...";

          msg.className = "msg";

          msg.style.display = "block";

          const response = await fetch("/api/auth/login", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              email: email,
              password: password,
            }),
          });

          const result = await response.json();

          console.log("RESPUESTA:", result);

          if (!response.ok) {
            throw new Error(result.message || "Credenciales incorrectas");
          }

          localStorage.setItem("helpdeskUser", JSON.stringify(result.data));

          window.location.href = "/";
        } catch (error) {
          console.error("ERROR LOGIN:", error);

          msg.textContent = error.message;

          msg.className = "msg error";

          msg.style.display = "block";
        }
      });
    </script>
  </body>
</html>
