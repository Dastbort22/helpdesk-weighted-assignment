<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión | HelpDesk</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(430px, 92%);
        background: #fff;
        padding: 34px;
        border-radius: 18px;
        box-shadow: 0 12px 35px #0002;
      }
      .brand {
        background: #111827;
        color: #fff;
        padding: 25px;
        border-radius: 14px;
        margin-bottom: 24px;
      }
      .brand h1 {
        margin: 0 0 8px;
      }
      .brand p {
        margin: 0;
        color: #cbd5e1;
      }
      label {
        display: block;
        font-weight: 700;
        margin: 14px 0 7px;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
      }
      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        margin-top: 20px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      .msg {
        display: none;
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
      }
      .error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
      }
      .hint {
        margin-top: 18px;
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }
      .link {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <h1>🎫 HelpDesk</h1>
        <p>Sistema de Mesa de Ayuda</p>
      </div>
      <h2>Iniciar sesión</h2>
      <form id="loginForm">
        <label>Email</label
        ><input
          id="email"
          type="email"
          required
          placeholder="correo@ejemplo.com"
          required
        /><label>Contraseña</label
        ><input
          id="password"
          type="password"
          required
          placeholder="••••••••"
          required
        /><button type="submit">Ingresar al sistema</button>
      </form>
      <div id="msg" class="msg"></div>
      <div class="hint">
        Después de iniciar sesión podrás gestionar usuarios y tickets mediante
        formularios, incluyendo crear, consultar, actualizar y eliminar
        registros.
      </div>
      <a class="link" href="/api-docs">Ver documentación Swagger</a>
    </main>
    <script>
      const loginForm = document.getElementById("loginForm");

      const emailInput = document.getElementById("email");

      const passwordInput = document.getElementById("password");

      const msg = document.getElementById("msg");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        const password = passwordInput.value;

        console.log("EMAIL:", email);

        console.log("PASSWORD:", password);

        if (email === "" || password === "") {
          msg.textContent = "Email y contraseña son requeridos";

          msg.className = "msg error";

          msg.style.display = "block";

          return;
        }

        try {
          msg.textContent = "Iniciando sesión...";

          msg.className = "msg";

          msg.style.display = "block";

          const response = await fetch("/api/auth/login", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              email: email,
              password: password,
            }),
          });

          const result = await response.json();

          console.log("RESPUESTA:", result);

          if (!response.ok) {
            throw new Error(result.message || "Credenciales incorrectas");
          }

          localStorage.setItem("helpdeskUser", JSON.stringify(result.data));

          window.location.href = "/";
        } catch (error) {
          console.error("ERROR LOGIN:", error);

          msg.textContent = error.message;

          msg.className = "msg error";

          msg.style.display = "block";
        }
      });
    </script>
  </body>
</html>
