<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HelpDesk</title>
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <h1>Sistema de Mesa de Ayuda</h1>
        <p>Asignación ponderada por Skills, carga y cumplimiento de SLA.</p>
        <div class="topbar">
          <a class="btn" href="/tickets.html"
            >🎫 Registrar / gestionar tickets</a
          ><a class="btn dark" href="/users.html">👥 CRUD de usuarios</a
          ><a class="btn dark" href="/api-docs">Swagger</a
          ><button class="btn red" onclick="logout()">Cerrar sesión</button
          ><span id="user" class="user"></span>
        </div>
      </div>
      <div class="grid">
        <div class="card">
          <h3>Tickets</h3>
          <div id="tickets" class="metric">-</div>
        </div>
        <div class="card">
          <h3>Agentes</h3>
          <div id="agents" class="metric">-</div>
        </div>
        <div class="card">
          <h3>Skills</h3>
          <div id="skills" class="metric">-</div>
        </div>
      </div>
      <div class="card section">
        <h2>Tickets recientes</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Prioridad</th>
              <th>Agente</th>
              <th>Vencimiento</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr>
              <td colspan="5">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script>
      const u = JSON.parse(localStorage.getItem("helpdeskUser") || "null");
      if (!u) location.href = "/login.html";
      else user.textContent = `Sesión: ${u.name} · ${u.role}`;
      function logout() {
        localStorage.removeItem("helpdeskUser");
        location.href = "/login.html";
      }
      async function cargar() {
        try {
          const [t, a, s] = await Promise.all([
            fetch("/api/tickets").then((r) => r.json()),
            fetch("/api/agents").then((r) => r.json()),
            fetch("/api/skills").then((r) => r.json()),
          ]);
          tickets.textContent = t.data.length;
          agents.textContent = a.data.length;
          skills.textContent = s.data.length;
          rows.innerHTML =
            t.data
              .slice(0, 10)
              .map(
                (x) =>
                  `<tr><td>${x.id}</td><td>${x.title}</td><td><span class="pill">${x.priority}</span></td><td>${x.agent_name || "Sin asignar"}</td><td>${x.due_at ? new Date(x.due_at).toLocaleString("es-CO") : "-"}</td></tr>`,
              )
              .join("") ||
            '<tr><td colspan="5">No hay tickets registrados.</td></tr>';
        } catch (e) {
          rows.innerHTML = `<tr><td colspan="5">${e.message}</td></tr>`;
        }
      }
      cargar();
    </script>
  </body>
</html>
