<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HelpDesk</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
        background: #f4f6f8;
        color: #1f2937;
      }
      .wrap {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px #0001;
      }
      button {
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }
      .hero {
        background: #111827;
        color: white;
        padding: 28px;
        border-radius: 16px;
        margin-bottom: 20px;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <h1>Sistema de Mesa de Ayuda</h1>
        <p>Asignación ponderada por Skills, carga y cumplimiento de SLA.</p>
        <button onclick="cargar()">Actualizar</button>
        <a href="/api-docs" style="color: white; margin-left: 15px">Swagger</a>
      </div>
      <div class="grid">
        <div class="card">
          <h3>Tickets</h3>
          <h2 id="tickets">-</h2>
        </div>
        <div class="card">
          <h3>Agentes</h3>
          <h2 id="agents">-</h2>
        </div>
        <div class="card">
          <h3>Skills</h3>
          <h2 id="skills">-</h2>
        </div>
      </div>
      <div class="card" style="margin-top: 20px">
        <h2>Tickets</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Prioridad</th>
              <th>Agente</th>
              <th>Vencimiento</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <script>
      async function cargar() {
        let [t, a, s] = await Promise.all([
          fetch("/api/tickets").then((r) => r.json()),
          fetch("/api/agents").then((r) => r.json()),
          fetch("/api/skills").then((r) => r.json()),
        ]);
        tickets.textContent = t.data.length;
        agents.textContent = a.data.length;
        skills.textContent = s.data.length;
        rows.innerHTML = t.data
          .map(
            (x) =>
              `<tr><td>${x.id}</td><td>${x.title}</td><td>${x.priority}</td><td>${x.agent_name || "Sin asignar"}</td><td>${x.due_at ? new Date(x.due_at).toLocaleString() : "-"}</td></tr>`,
          )
          .join("");
      }
      cargar();
    </script>
  </body>
</html>
