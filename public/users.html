<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Usuarios | HelpDesk</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial;
        margin: 0;
        background: #f4f6f8;
        color: #1f2937;
      }
      .wrap {
        max-width: 1200px;
        margin: 35px auto;
        padding: 0 20px;
      }
      .hero {
        background: #111827;
        color: #fff;
        padding: 25px;
        border-radius: 16px;
        margin-bottom: 20px;
      }
      .hero h1 {
        margin: 0 0 10px;
      }
      .back {
        color: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .card {
        background: #fff;
        padding: 24px;
        border-radius: 14px;
        box-shadow: 0 2px 10px #0001;
      }
      label {
        display: block;
        font-weight: bold;
        margin: 12px 0 6px;
      }
      input {
        width: 100%;
        padding: 11px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #2563eb;
        cursor: pointer;
        margin-top: 14px;
      }
      .warn {
        background: #d97706;
      }
      .danger {
        background: #dc2626;
      }
      .success {
        background: #16a34a;
      }
      .msg {
        margin-top: 12px;
        padding: 10px;
        border-radius: 8px;
      }
      .ok {
        background: #dcfce7;
        color: #166534;
      }
      .err {
        background: #fee2e2;
        color: #991b1b;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 11px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <h1>👥 Gestión de usuarios</h1>
        <a class="back" href="/">← Volver al dashboard</a>
      </div>
      <div class="grid">
        <div class="card">
          <h2>POST · Registrar</h2>
          <form id="create">
            <label>Nombre</label><input id="name" required /><label>Email</label
            ><input id="email" type="email" required /><label>Contraseña</label
            ><input id="password" type="password" required /><label>Rol</label
            ><input id="role" value="requester" /><button class="success">
              Crear usuario
            </button>
          </form>
          <div id="cm"></div>
        </div>
        <div class="card">
          <h2>PUT · Actualizar</h2>
          <form id="update">
            <label>ID</label><input id="uid" type="number" required /><label
              >Nombre</label
            ><input id="uname" required /><label>Email</label
            ><input id="uemail" type="email" required /><button class="warn">
              Actualizar usuario
            </button>
          </form>
          <div id="um"></div>
        </div>
      </div>
      <div class="card" style="margin-top: 18px">
        <h2>GET / DELETE · Usuarios</h2>
        <button onclick="load()">🔄 Actualizar</button>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <script>
      if (!localStorage.getItem("helpdeskUser")) location.href = "/login.html";
      const api = "/api/users";
      const esc = (s) =>
        String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      async function load() {
        const r = await fetch(api);
        const j = await r.json();
        rows.innerHTML =
          j.data
            .map(
              (x) =>
                `<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.role || "requester")}</td><td><button class="warn" onclick="fill(${x.id},'${String(x.name).replaceAll("'", "\\'")}','${String(x.email).replaceAll("'", "\\'")}')">Editar</button> <button class="danger" onclick="del(${x.id})">Eliminar</button></td></tr>`,
            )
            .join("") || '<tr><td colspan="5">Sin usuarios</td></tr>';
      }
      create.onsubmit = async (e) => {
        e.preventDefault();
        const r = await fetch(api, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: name.value,
            email: email.value,
            password: password.value,
            role: role.value,
          }),
        });
        const j = await r.json();
        cm.className = j.success ? "msg ok" : "msg err";
        cm.textContent = j.success ? "Usuario creado correctamente" : j.message;
        if (j.success) {
          create.reset();
          role.value = "requester";
          load();
        }
      };
      update.onsubmit = async (e) => {
        e.preventDefault();
        const r = await fetch(`${api}/${uid.value}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: uname.value, email: uemail.value }),
        });
        const j = await r.json();
        um.className = j.success ? "msg ok" : "msg err";
        um.textContent = j.success ? "Usuario actualizado" : j.message;
        if (j.success) load();
      };
      function fill(id, n, e) {
        uid.value = id;
        uname.value = n;
        uemail.value = e;
        scrollTo({ top: 0, behavior: "smooth" });
      }
      async function del(id) {
        if (!confirm("¿Eliminar usuario #" + id + "?")) return;
        const r = await fetch(`${api}/${id}`, { method: "DELETE" });
        const j = await r.json();
        alert(j.message || "Operación realizada");
        load();
      }
      load();
    </script>
  </body>
</html>
